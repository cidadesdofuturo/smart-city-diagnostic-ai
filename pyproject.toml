[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-city-diagnostic-ai"
version = "0.3.0"
description = "Diagnóstico municipal com Claude Sonnet, Claude Web Search, Gemini embeddings e RAG granular da Carta Brasileira para Cidades Inteligentes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pydantic>=2.10,<3",
  "langchain-core>=1.5,<2",
  "langchain-community==0.4.2",
  "langchain-anthropic>=1.5,<2",
  "langchain-google-genai>=4.3,<5",
  "faiss-cpu>=1.11,<2",
]

[project.scripts]
smart-city-diagnostic = "municipio_analise.cli:main"

[tool.setuptools]
packages = ["municipio_analise"]

[tool.setuptools.package-data]
municipio_analise = ["data/*.json"]
